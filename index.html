<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C-T2M Training Results</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      line-height: 1.6;
    }

    /* ── Page header ─────────────────────────────────────────────── */
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }
    header h1 {
      font-size: 2rem;
      color: #f0f6fc;
      letter-spacing: -0.5px;
    }
    header p {
      margin-top: 0.4rem;
      color: #8b949e;
    }

    /* ── TOC / jump links ─────────────────────────────────────────── */
    nav {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 0.75rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.75rem;
      justify-content: center;
    }
    nav a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.82rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      transition: background 0.15s;
    }
    nav a:hover { background: #21262d; }

    /* ── Main layout ──────────────────────────────────────────────── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    /* ── Training section card ────────────────────────────────────── */
    .training-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
    }

    .section-header {
      background: #21262d;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid #30363d;
    }
    .section-header h2 {
      font-size: 1.15rem;
      color: #f0f6fc;
    }
    .training-desc {
      font-size: 0.95rem;
      font-weight: 400;
      color: #8b949e;
    }

    .section-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* ── Collapsible metrics plot ─────────────────────────────────── */
    details.metrics {
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }
    details.metrics summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1rem;
      background: #21262d;
      user-select: none;
      font-weight: 600;
      color: #c9d1d9;
      transition: background 0.15s;
    }
    details.metrics summary::-webkit-details-marker { display: none; }
    details.metrics summary:hover { background: #2d333b; }
    details.metrics summary::before {
      content: "▶";
      font-size: 0.7rem;
      transition: transform 0.2s;
      color: #58a6ff;
    }
    details.metrics[open] summary::before { transform: rotate(90deg); }

    .metrics-plot {
      display: block;
      width: 100%;
      height: auto;
      padding: 1rem;
      background: #0d1117;
    }

    /* ── Gif strip ────────────────────────────────────────────────── */
    .gif-strip-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .gif-strip {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      /* custom scrollbar */
      scrollbar-width: thin;
      scrollbar-color: #30363d #161b22;
    }
    .gif-strip::-webkit-scrollbar { height: 6px; }
    .gif-strip::-webkit-scrollbar-track { background: #161b22; }
    .gif-strip::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 3px;
    }

    .gif-item {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }
    .gif-item img {
      height: 550px;
      width: auto;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
    }
    .gif-item span {
      font-size: 0.78rem;
      color: #8b949e;
    }

    /* ── Footer ───────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 2rem;
      color: #484f58;
      font-size: 0.82rem;
      border-top: 1px solid #1c2128;
    }
  </style>
</head>
<body>

<header>
  <h1>C-T2M Training Results</h1>
  <p>Visualizations and metrics for all 15 training runs</p>
</header>

<nav id="toc">
  <!-- Jump links generated by JS -->
</nav>

<main id="main-content">
  <!-- Sections generated by JS -->
</main>

<footer>
  C-T2M &mdash; Thesis results &mdash; <span id="footer-year"></span>
  <script>document.getElementById("footer-year").textContent = new Date().getFullYear();</script>
</footer>

<script>
  /**
   * Configuration
   * ─────────────
   * BASE_PATH  : path to the C-T2M_trainings folder (relative to index.html)
   * NUM_TRAININGS : number of training runs
   * TRAINING_DESCRIPTIONS : short description for each training run (index 0 = Training 1).
   *                         Leave a string empty ("") to show no description.
   * GIFS       : list of { file, label } for each gif in visualizations_best_epoch/
   *
   * Update TRAINING_DESCRIPTIONS and GIFS as needed.
   */
  const BASE_PATH = "C-T2M_trainings";
  const NUM_TRAININGS = 15;
  const TRAINING_DESCRIPTIONS = [
    "full teacher forcing (TF)", // Training 1
    "TF ratio to 0.0", // Training 2
    "TF ratio to 0.2", // Training 3
    "λ_vel = 5.0", // Training 4
    "λ_vel = 1.0", // Training 5
    "λ_lang = 0.1", // Training 6
    "λ_sem = 5.0", // Training 7
    "λ_sem = 10.0", // Training 8
    "λ_vel = 5.0, CFG enabled", // Training 9
    "contrastive autoencoder, encoder frozen", // Training 10
    "contrastive autoencoder", // Training 11
    "smooth autoencoder, encoder frozen", // Training 12
    "smooth autoencoder", // Training 13
    "larger LLM backbone Gemma-2-2B", // Training 14
    "λ_vel = 5.0, longer training", // Training 15
  ];
  const GIFS = [
    { file: "1.gif", label: "train_000001" },
    { file: "2.gif", label: "train_000002" },
    { file: "3.gif", label: "train_000003" },
    { file: "4.gif", label: "val_012698"   },
    { file: "5.gif", label: "val_012808"   },
    { file: "6.gif", label: "val_008646"   }
  ];

  // ── Build navigation ──────────────────────────────────────────────
  const nav = document.getElementById("toc");
  for (let i = 1; i <= NUM_TRAININGS; i++) {
    const a = document.createElement("a");
    a.href = `#training-${i}`;
    a.textContent = `Training ${i}`;
    nav.appendChild(a);
  }

  // ── Build sections ────────────────────────────────────────────────
  const main = document.getElementById("main-content");

  for (let i = 1; i <= NUM_TRAININGS; i++) {
    const trainingFolder = `${BASE_PATH}/Training ${i}`;
    const vizFolder = `${trainingFolder}/visualizations_best_epoch`;
    const metricsPlot = `${trainingFolder}/${i}_metrics_plot.png`;

    // ── Section card ─────────────────────────────────────────────
    const section = document.createElement("section");
    section.className = "training-section";
    section.id = `training-${i}`;

    // ── Section header ───────────────────────────────────────────
    const desc = TRAINING_DESCRIPTIONS[i - 1];
    const header = document.createElement("div");
    header.className = "section-header";
    header.innerHTML = `<h2>Training ${i}${desc ? ` <span class="training-desc">(${desc})</span>` : ""}</h2>`;
    section.appendChild(header);

    // ── Section body ─────────────────────────────────────────────
    const body = document.createElement("div");
    body.className = "section-body";

    // ── Collapsible metrics plot ──────────────────────────────────
    const details = document.createElement("details");
    details.className = "metrics";
    details.innerHTML = `
      <summary>Metrics Plot</summary>
      <img class="metrics-plot"
           src="${metricsPlot}"
           alt="Metrics plot for Training ${i}"
           loading="lazy" />
    `;
    body.appendChild(details);

    // ── GIF strip ─────────────────────────────────────────────────
    const stripLabel = document.createElement("div");
    stripLabel.className = "gif-strip-label";
    stripLabel.textContent = "Best Epoch Visualizations";
    body.appendChild(stripLabel);

    const strip = document.createElement("div");
    strip.className = "gif-strip";

    GIFS.forEach(({ file, label }) => {
      const item = document.createElement("div");
      item.className = "gif-item";
      item.innerHTML = `
        <img src="${vizFolder}/${file}"
             alt="Training ${i} – ${label}"
             loading="lazy" />
        <span>${label}</span>
      `;
      strip.appendChild(item);
    });

    body.appendChild(strip);
    section.appendChild(body);
    main.appendChild(section);
  }
</script>

</body>
</html>
